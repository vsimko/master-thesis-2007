name: Build Thesis PDF

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    name: Build and publish thesis PDF
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4

      # The SVG package in the thesis invokes Inkscape through -shell-escape.
      - name: Install Inkscape
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends inkscape poppler-utils

      # TeX Live is cached by the action. Bump cache_version when changing
      # the TeX Live version or required package set to force a fresh install.
      - name: Install cached TeX Live
        uses: zauguin/install-texlive@v4
        with:
          texlive_version: 2026
          cache_version: 1
          packages: >
            latexmk
            collection-latexrecommended
            collection-latexextra
            collection-fontsrecommended
            collection-langczechslovak

      - name: Validate build and SVG source pipeline
        run: ./build.sh test

      - name: Build PDF
        run: ./build.sh build

      - name: Verify searchable text survives into the PDF
        run: |
          pdftotext -layout main.pdf main.txt
          python3 - <<'PY'
          from pathlib import Path
          text = ' '.join(Path('main.txt').read_text(errors='replace').lower().split())
          required = [
              'multicast network', 'shared application', 'primarycamera',
              'quickbridge', 'flash media server', 'psnr',
              'mouth-to-ear-delay', 'nat gateway', 'oais',
              'supernode', 'accessgrid session'
          ]
          missing = [label for label in required if label not in text]
          if missing:
              raise SystemExit('PDF text extraction is missing SVG labels: ' + ', '.join(missing))

          import re
          import subprocess
          def page_text(number, caption):
              raw = subprocess.run(
                  ['pdftotext', '-f', str(number), '-l', str(number), '-layout', 'main.pdf', '-'],
                  check=True, capture_output=True, text=True,
              ).stdout
              return raw.split(caption, 1)[0]

          page53 = page_text(59, 'Figure 7.6')
          page54 = page_text(60, 'Figure 7.7')
          lines53 = [
              re.sub(r'\s+', '', line).lower()
              for line in page53.splitlines() if line.strip()
          ]
          lines54 = [
              re.sub(r'\s+', '', line).lower()
              for line in page54.splitlines() if line.strip()
          ]
          if not any('quickbridge' in line for line in lines53) or 'unicast' not in lines53:
              raise SystemExit('PDF page 53 is missing the QuickBridge/unicast labels')
          merged_labels = ('registryserver', 'multicastisland', 'umtpagent', 'umtpserver')
          if any(label in line for label in merged_labels for line in lines54):
              raise SystemExit('PDF page 54 contains merged AGConnector labels')
          print('Searchable SVG labels found in PDF:', ', '.join(required))
          print('PDF pages 53-54: multiline diagram labels remain separated.')
          PY

      - name: Upload PDF preview
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf-preview-${{ github.run_number }}
          path: main.pdf
          retention-days: 14

      - name: Audit final LaTeX and BibTeX logs
        run: python3 ./tests/check_build_logs.py

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thesis-build-diagnostics-${{ github.run_number }}
          path: |
            main.log
            main.blg
            main.aux
            main.lof
            main.lot
            main.toc
            main.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Thesis Release v${{ github.run_number }}"
          body: |
            Automated PDF release for merge commit ${{ github.sha }}.
          files: main.pdf
          generate_release_notes: true
          make_latest: true

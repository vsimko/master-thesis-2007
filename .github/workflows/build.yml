name: Build Thesis PDF

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build LaTeX PDF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX dependencies for testing build script
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-lang-czechslovak

      - name: Run build script test suite
        run: ./build.sh test

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_pdflatex: true

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: master-thesis
          path: main.pdf
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Thesis Release v${{ github.run_number }}"
          body: |
            Automaticky publikované vydanie po úspešnom zlúčení do vetvy `main`.
          files: main.pdf
          generate_release_notes: true
          make_latest: true

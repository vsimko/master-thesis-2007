name: Build Thesis PDF

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and validate thesis PDF
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The SVG package in the thesis invokes Inkscape through -shell-escape.
      - name: Install Inkscape
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends inkscape poppler-utils

      # TeX Live is cached by the action. Bump cache_version when changing
      # the TeX Live version or required package set to force a fresh install.
      - name: Install cached TeX Live
        uses: zauguin/install-texlive@f5e7d0b117035fff797d4392ea94131747e03d60 # v4
        with:
          texlive_version: 2026
          cache_version: 1
          packages: >
            latexmk
            collection-latexrecommended
            collection-latexextra
            collection-fontsrecommended
            collection-langczechslovak

      - name: Validate build and SVG source pipeline
        run: ./build.sh test

      - name: Build PDF
        run: ./build.sh build

      - name: Verify searchable text survives into the PDF
        run: |
          pdftotext -layout main.pdf main.txt
          python3 - <<'PY'
          from pathlib import Path
          text = ' '.join(Path('main.txt').read_text(errors='replace').lower().split())
          required = [
              'multicast network', 'shared application', 'primarycamera',
              'quickbridge', 'flash media server', 'psnr',
              'mouth-to-ear-delay', 'nat gateway', 'oais',
              'supernode', 'accessgrid session'
          ]
          missing = [label for label in required if label not in text]
          if missing:
              raise SystemExit('PDF text extraction is missing SVG labels: ' + ', '.join(missing))

          import subprocess
          import xml.etree.ElementTree as ET

          subprocess.run(
              ['pdftotext', '-f', '59', '-l', '60', '-bbox', 'main.pdf', 'diagram-pages.xml'],
              check=True,
          )
          root = ET.parse('diagram-pages.xml').getroot()
          pages = [node for node in root.iter() if node.tag.endswith('page')]
          if len(pages) != 2:
              raise SystemExit(f'Expected two diagram pages, found {len(pages)}')

          def words(page):
              return [
                  (
                      (node.text or '').strip(),
                      (float(node.get('xMin')) + float(node.get('xMax'))) / 2,
                      (float(node.get('yMin')) + float(node.get('yMax'))) / 2,
                  )
                  for node in page.iter()
                  if node.tag.endswith('word') and (node.text or '').strip()
              ]

          page53_words = words(pages[0])
          page53_labels = {item[0].lower() for item in page53_words}
          if 'quickbridge' not in page53_labels or 'unicast' not in page53_labels:
              raise SystemExit('PDF page 53 is missing the QuickBridge/unicast labels')

          def require_separate_lines(page, first, second, x_tolerance=45):
              items = words(page)
              first_words = [item for item in items if item[0] == first]
              second_words = [item for item in items if item[0] == second]
              return any(
                  abs(a[1] - b[1]) <= x_tolerance and abs(a[2] - b[2]) > 2
                  for a in first_words for b in second_words
              )

          for first, second in (
              ('Registry', 'Server'),
              ('Multicast', 'Island'),
              ('UMTP', 'Agent'),
              ('UMTP', 'Server'),
          ):
              if not require_separate_lines(pages[1], first, second):
                  raise SystemExit(
                      f'PDF page 54: {first}/{second} are not on distinct lines'
                  )

          print('Searchable SVG labels found in PDF:', ', '.join(required))
          print('PDF pages 53-54: multiline diagram labels have distinct text baselines.')
          PY

      - name: Upload PDF build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thesis-pdf-${{ github.run_number }}
          path: main.pdf
          if-no-files-found: error
          retention-days: 14

      - name: Audit final LaTeX and BibTeX logs
        run: python3 ./tests/check_build_logs.py

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thesis-build-diagnostics-${{ github.run_number }}
          path: |
            main.log
            main.blg
            main.aux
            main.lof
            main.lot
            main.toc
            main.txt
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download validated PDF
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: thesis-pdf-${{ github.run_number }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ github.run_number }}
          name: "Thesis Release v${{ github.run_number }}"
          body: |
            Automated PDF release for merge commit ${{ github.sha }}.
          files: main.pdf
          generate_release_notes: true
          make_latest: true

name: Restore original SVG typography and add searchable text

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Install LibreOffice Draw
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-draw

      - name: Export text from original ODG files
        shell: bash
        run: |
          set -euo pipefail
          source_commit="6f5adde6b9cbfebd2539d51c61776b1c7b95eb0b"
          names=(
            arch-ag-default arch-ag-sharedapp arch-agconnector
            arch-ciant-ag-node arch-ciant-ag-room arch-multicast
            arch-quickbridge arch-stream-vnc flash-architecture
            h261-vs-nv h263-vs-h261 h264-vs-h263 h264-vs-mpeg2
            localhost-recording mff-logo mouth-to-ear-delay
            nat-architecture oais-environment resolutions
            sequence-stream-vnc skype-architecture unicast-multicast
            vc-input-formats
          )

          mkdir -p /tmp/original-odg /tmp/original-svg /tmp/exported-svg /tmp/merged-svg
          for name in "${names[@]}"; do
            git show "${source_commit}:images/${name}.odg" > "/tmp/original-odg/${name}.odg"
            git show "${source_commit}:images/${name}.svg" > "/tmp/original-svg/${name}.svg"
          done




          # Apply the typography fixes to the ODG text objects before export.
          # The ODG files are temporary historical sources and are not committed.
          python3 scripts/patch_odg_labels.py /tmp/original-odg/arch-quickbridge.odg
          python3 scripts/patch_odg_labels.py /tmp/original-odg/arch-agconnector.odg

          libreoffice --headless --convert-to svg --outdir /tmp/exported-svg /tmp/original-odg/*.odg

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ns = "{http://www.w3.org/2000/svg}"
          for name in ("arch-quickbridge", "arch-agconnector"):
              root = ET.parse(f"/tmp/exported-svg/{name}.svg").getroot()
              print("EXPORTED-TEXT", name)
              for node in root.iter(ns + "text"):
                  value = "".join(node.itertext()).strip()
                  if value in {"QuickBridge", "unicast", "Registry", "Server"}:
                      chain, current = [], node
                      while current is not None and len(chain) < 6:
                          chain.append((current.tag.split("}")[-1], current.attrib))
                          current = next((parent for parent in root.iter() if current in list(parent)), None)
                      print("EXPORTED-LABEL", repr(value), "chain", chain)
                      for child in node.iter():
                          if child is not node:
                              print("EXPORTED-CHILD", repr("".join(child.itertext()).strip()), child.attrib)
              for style in root.iter(ns + "style"):
                  css = "".join(style.itertext())
                  if "SVGTextShape" in css or "font-family" in css:
                      print("EXPORTED-CSS", css[:3000])
          PY

          for name in "${names[@]}"; do
            if [[ "$name" == "arch-quickbridge" || "$name" == "arch-agconnector" ]]; then
              # For the repaired diagrams, the patched ODG export is the visual
              # source of truth; do not reintroduce the legacy outlined labels.
              cp "/tmp/exported-svg/${name}.svg" "/tmp/merged-svg/${name}.svg"
            else
              python3 scripts/merge_svg_text.py \
                --original "/tmp/original-svg/${name}.svg" \
                --exported "/tmp/exported-svg/${name}.svg" \
                --output "/tmp/merged-svg/${name}.svg"
            fi
          done

          cp /tmp/merged-svg/*.svg images/
          git add images/*.svg
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Preserve original SVG typography and add searchable text"
            git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          else
            echo "SVG artwork and searchable text are already up to date."
          fi

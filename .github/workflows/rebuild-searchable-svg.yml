name: Restore original SVG typography and add searchable text

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Install LibreOffice Draw
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-draw

      - name: Export text from original ODG files
        shell: bash
        run: |
          set -euo pipefail
          source_commit="6f5adde6b9cbfebd2539d51c61776b1c7b95eb0b"
          names=(
            arch-ag-default arch-ag-sharedapp arch-agconnector
            arch-ciant-ag-node arch-ciant-ag-room arch-multicast
            arch-quickbridge arch-stream-vnc flash-architecture
            h261-vs-nv h263-vs-h261 h264-vs-h263 h264-vs-mpeg2
            localhost-recording mff-logo mouth-to-ear-delay
            nat-architecture oais-environment resolutions
            sequence-stream-vnc skype-architecture unicast-multicast
            vc-input-formats
          )

          mkdir -p /tmp/original-odg /tmp/original-svg /tmp/exported-svg /tmp/merged-svg
          for name in "${names[@]}"; do
            git show "${source_commit}:images/${name}.odg" > "/tmp/original-odg/${name}.odg"
            git show "${source_commit}:images/${name}.svg" > "/tmp/original-svg/${name}.svg"
          done

          python3 - <<'PY'
          import zipfile
          import xml.etree.ElementTree as ET
          targets = {"arch-quickbridge": {"QuickBridge", "unicast"},
                     "arch-agconnector": {"Registry", "Server"}}
          ns = {"text": "urn:oasis:names:tc:opendocument:xmlns:text:1.0"}
          for name, labels in targets.items():
              with zipfile.ZipFile(f"/tmp/original-odg/{name}.odg") as z:
                  root = ET.fromstring(z.read("content.xml"))
                  parent = {child: node for node in root.iter() for child in node}
                  print(f"ODG-LABEL-DIAGNOSTIC {name}")
                  for p in root.iter(f"{{{ns['text']}}}p"):
                      value = "".join(p.itertext()).strip()
                      if any(label.lower() in value.lower() for label in labels):
                          chain, node = [], p
                          while node is not None and len(chain) < 8:
                              chain.append((node.tag.split("}")[-1], node.attrib))
                              node = parent.get(node)
                          print({"text": value, "ancestors": chain})
          PY


          python3 - <<'PY'
          import zipfile, xml.etree.ElementTree as ET
          for name in ("arch-quickbridge", "arch-agconnector"):
              with zipfile.ZipFile(f"/tmp/original-odg/{name}.odg") as z:
                  root = ET.fromstring(z.read("content.xml"))
                  print("ODG-STRUCTURE", name, "elements", len(list(root.iter())))
                  for node in root.iter():
                      tag = node.tag.split("}")[-1]
                      value = "".join(node.itertext()).strip()
                      if value or tag in ("custom-shape", "rect", "ellipse", "frame"):
                          print("ODG-NODE", tag, node.attrib, repr(value[:120]))
          PY

          libreoffice --headless --convert-to svg --outdir /tmp/exported-svg /tmp/original-odg/*.odg

          for name in "${names[@]}"; do
            python3 scripts/merge_svg_text.py \
              --original "/tmp/original-svg/${name}.svg" \
              --exported "/tmp/exported-svg/${name}.svg" \
              --output "/tmp/merged-svg/${name}.svg"
          done

          cp /tmp/merged-svg/*.svg images/
          git add images/*.svg
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Preserve original SVG typography and add searchable text"
            git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          else
            echo "SVG artwork and searchable text are already up to date."
          fi
